[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT"]
# E712: `== True/False` is the required SQLAlchemy column-comparison idiom.
# A002/A003: `type`/`id` are conventional FastAPI query-param / path names.
ignore = ["S101", "B008", "E712", "A002", "A003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]
"migrations/*" = ["E", "F", "N"]

[tool.mypy]
python_version = "3.12"
strict = false
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false

# FastAPI route handlers declare their response contract via `response_model=`
# and are thin delegators to the service layer; explicit return annotations add
# noise without catching bugs. Strict typing stays enforced everywhere else.
[[tool.mypy.overrides]]
module = "app.api.v1.*"
disallow_untyped_defs = false
