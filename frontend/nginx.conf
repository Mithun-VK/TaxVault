# TaxVault edge: serves the SPA and reverse-proxies the API on one origin.
# Same-origin means no CORS preflights and no absolute backend URL in the bundle.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend caps uploads at MAX_UPLOAD_SIZE_MB (20). Leave headroom for
    # multipart overhead so the API returns its own 413 message, not nginx's.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container healthcheck target - never reaches the API.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Docker's embedded DNS, re-resolved every 10s. Combined with the variable
    # in proxy_pass below this means nginx starts even when the API is still
    # booting, and picks up a new container IP after an API restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Report generation and large document downloads can outrun the default 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream uploads/downloads instead of spooling whole files to disk.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # Vite emits content-hashed filenames, so assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients pin themselves to an old build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: React Router owns every unmatched path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
